<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>مصنع الرعب</title>
  <meta name="description" content="مصنع فيديوهات آلي بعشرة روبوتات لقصص الرعب وعالم الجريمة والألغاز" />
  <meta name="theme-color" content="#0b0b0f" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icons/icon-192.png" alt="" /><div><b>مصنع الرعب</b><small>10 روبوتات · رعب · جريمة · ألغاز</small></div></div>
    <button id="installBtn" class="btn ghost hidden">⬇️ تثبيت التطبيق</button>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="factory" class="active">🏭<span>المصنع</span></button>
    <button data-view="line">⚙️<span>خط الإنتاج</span><i id="badgeLine"></i></button>
    <button data-view="review">👁️<span>المراجعة</span><i id="badgeReview"></i></button>
    <button data-view="library">📚<span>المكتبة</span></button>
    <button data-view="settings">🔑<span>الإعدادات</span></button>
  </nav>

  <main id="view"></main>
  <div id="toast" class="toast"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
