# ============================================================
#  Video Factory — channel configuration
# ============================================================
channel:
  name: "My Channel"
  language: "ar"            # ar | en  (ar enables RTL captions + Arabic voice)
  default_format: "9:16"    # 9:16 (Shorts/Reels/TikTok) | 16:9 (YouTube)
  target_duration_sec: 45

# Where the factory runs. "auto" detects Android/Termux vs Windows vs Linux.
runtime:
  mode: "auto"              # auto | windows | termux | linux
  projects_dir: "projects"
  db_path: "factory.db"
  max_retries: 3            # QA → agent retries per task
  worker_poll_sec: 5

capcut:
  # Windows default. %LOCALAPPDATA% is expanded automatically.
  drafts_dir: "%LOCALAPPDATA%/CapCut/User Data/Projects/com.lveditor.draft"
  # Optional: path to a sample draft folder you created manually (see README §2).
  # When set, every generated draft is built ON TOP of its JSON (template mode),
  # so the structure matches your CapCut version exactly.
  template_draft: ""
  # On the phone (Termux) the draft is written inside the project and zipped,
  # so you can copy it into the PC drafts folder later.
  phone_drafts_dir: "projects/_capcut_drafts"

render:
  # capcut_ui : Windows UI automation opens CapCut and clicks Export
  # manual    : you export in CapCut with one click; the factory waits for the file
  # ffmpeg    : full render with FFmpeg (default on the phone — no CapCut needed)
  backend: "auto"           # auto → ffmpeg on phone/linux, manual on windows
  codec: "libx264"          # libx264 | libx265
  crf: 20
  fps: 30
  preview_height: 640
  capcut_export_dir: "%USERPROFILE%/Videos/CapCut"
  manual_wait_timeout_min: 0   # 0 = wait forever for your manual export

resolutions:
  "9:16": [1080, 1920]
  "16:9": [1920, 1080]

voice:
  engine: "edge"            # edge | silent (silent = timing-only test mode)
  voices:
    ar: "ar-SA-HamedNeural"
    en: "en-US-AndrewNeural"
  rate: "+5%"

script:
  model: "claude-opus-5-5"
  effort: "medium"

assets:
  provider: "pexels"        # pexels | local | generated
  local_dir: "library"      # library/music, library/sfx, library/images
  music_volume_db: -20

captions:
  font_name: "Noto Naskh Arabic"   # must be installed (Windows) or placed in library/fonts
  font_file: ""                    # optional explicit .ttf path for FFmpeg/phone
  size: 64
  color: "#FFFFFF"
  stroke_color: "#000000"
  stroke_width: 4
  background: "#00000080"
  highlight_color: "#FFD400"
  max_words_per_line: 4
  position_y: 0.72          # 0 top … 1 bottom (kept inside safe zone)

safe_zone:                  # fraction of the frame kept free of UI overlays
  "9:16": {top: 0.10, bottom: 0.20, left: 0.06, right: 0.12}
  "16:9": {top: 0.06, bottom: 0.08, left: 0.05, right: 0.05}

color:
  # One channel look on an adjustment layer covering the whole timeline
  filter_key: "channel_look"   # key in effects_library.json → filters
  lut_file: ""                 # optional .cube in library/luts (FFmpeg + CapCut import)
  filter_intensity: 0.6
  adjust:                      # per-clip Adjust baseline (−50 … 50, CapCut scale)
    brightness: 3
    contrast: 8
    saturation: 6
    temperature: 2
    tint: 0
    highlights: -6
    shadows: 5

vfx:
  enabled: true
  intensity: "subtle"       # subtle | medium
  effects: ["film_grain", "vignette"]

sound:
  target_lufs: -14
  ducking_db: -12            # music level under speech relative to music_volume_db
  fade_in_sec: 0.8
  fade_out_sec: 1.5
  transition_sfx: true

platforms:
  available: ["youtube", "tiktok", "instagram"]
  default_for_9_16: ["youtube", "tiktok", "instagram"]
  default_for_16_9: ["youtube"]

telegram:
  send_preview: true
  poll_timeout_sec: 50
